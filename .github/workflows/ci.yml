name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - name: Restaurar
        run: dotnet restore
      - name: Formato
        run: dotnet format --verify-no-changes --no-restore
      - name: Compilar
        run: dotnet build --no-restore
      - name: Pruebas
        run: dotnet test --no-build
      - name: Imagen Docker
        run: docker build -t barberia-api .

  frontend:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Tipos
        run: npm run check
      - name: Estilo
        run: npm run lint
      - name: Código sin uso
        run: npm run lint:deadcode
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barberia
          POSTGRES_USER: barberia
          POSTGRES_PASSWORD: barberia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Levantar la API con datos de ejemplo
        working-directory: backend
        env:
          ConnectionStrings__Barberia: Host=localhost;Database=barberia;Username=barberia;Password=barberia
          Jwt__Key: clave-solo-para-ci-con-mas-de-32-caracteres
          Setup__ShopName: Barbería Don Lucho
          Setup__OwnerEmail: dueno@barberia.local
          Setup__OwnerPassword: barberia-local
          Setup__DemoData: "true"
          Cors__Origins__0: http://localhost:4173
        run: |
          nohup dotnet run --project src/Barberia.Api --urls http://localhost:5000 > api.log 2>&1 &
          for attempt in $(seq 1 90); do curl -sf http://localhost:5000/api/health && break; sleep 2; done
      - name: Instalar la web y el navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compilar y servir la web
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000
        run: |
          npm run build
          nohup npx vite preview --port 4173 > preview.log 2>&1 &
          sleep 5
      - name: Pruebas de punta a punta
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npm run test:e2e
      - name: Guardar trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-e2e
          path: |
            frontend/test-results
            backend/api.log
