# Mantiene despierta la API del plan gratis de Render en horario de la barbería (06:00 a 21:00 en La Paz).
# Viene apagado: para usarlo, crea la variable API_URL del repositorio y activa el flujo en Actions.
name: Mantener la API despierta

on:
  schedule:
    # Cada 10 minutos de 10:00 a 00:59 UTC, que son 06:00 a 20:59 en La Paz (UTC-4).
    - cron: '*/10 10-23 * * *'
    - cron: '*/10 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  despertar:
    name: Visitar la API
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pedir /api/health
        run: curl --fail --silent --show-error --max-time 120 "${{ vars.API_URL }}/api/health"
